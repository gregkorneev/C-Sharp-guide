services:
  postgres:
    image: postgres:latest
    container_name: pg_lab_container
    environment:
      POSTGRES_PASSWORD: lab_password
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_lab_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_lab_data:
    name: pg_lab_data